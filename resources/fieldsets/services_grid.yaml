title: 'Services Grid'
fields:
  -
    handle: subtitle
    field:
      type: text
      display: Subtitle
      width: 50
  -
    handle: apply_page_colour
    field:
      type: toggle
      display: 'Apply Page Colour'
      width: 50
  -
    handle: content
    field:
      remove_empty_nodes: false
      type: bard
      display: Content
  -
    handle: items
    field:
      type: replicator
      display: Items
      width: 50
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            items:
              display: Items
              fields:
                -
                  import: color
                -
                  handle: content
                  field:
                    buttons:
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - removeformat
                      - quote
                      - anchor
                      - image
                      - table
                    remove_empty_nodes: false
                    type: bard
                    display: Content
                -
                  handle: icon
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: Icon
