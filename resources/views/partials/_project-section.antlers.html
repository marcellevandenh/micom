<section class="project-section">
    <div class="wrapper">
        <div class="project-section__copy">
            {{ if heading }}<h2>{{ heading }}</h2>{{ /if }}
            {{ if description }}<div class="project-section__description">{{ description }}</div>{{ /if }}
        </div>
        {{ if photos }}
            <div class="project-section__gallery">
                {{ photos }}
                    {{ if image }}
                        <figure>
                            <a href="{{ image:url }}" aria-label="View full photo: {{ image:alt | entities }}">
                                <img src="{{ glide:image width='600' format='webp' }}"
                                    srcset="{{ glide:image width='400' format='webp' }} 400w, {{ glide:image width='600' format='webp' }} 600w, {{ glide:image width='1080' format='webp' }} 1080w"
                                    sizes="(min-width: 992px) 360px, (min-width: 601px) 50vw, 100vw"
                                    width="{{ image:width }}" height="{{ image:height }}"
                                    loading="lazy" decoding="async" alt="{{ image:alt | entities }}">
                            </a>
                            {{ if caption }}<figcaption>{{ caption }}</figcaption>{{ /if }}
                        </figure>
                    {{ /if }}
                {{ /photos }}
            </div>
        {{ /if }}
    </div>
</section>
