<section class="team-grid ">
    <div class="wrapper ">
        <div class="content  {{ page_colour ?= page_colour|slugify }} ">
            {{ if subtitle }}
                <p class="subtitle">
                    {{ subtitle }}
                </p>
            {{ endif }} 
            {{ content ? content : '' }}
        </div>
        <div class="items">
            {{ items }}
                <div class="item">
                    {{ if image }}
                        <div class="image">
                            <picture>
                                <source media="(min-width: 1200px)" srcset="{{ glide:image width='500' }}" type="image/webp">
                                <source media="(max-width: 1199px)" srcset="{{ glide:image width='500' }}" type="image/webp">
                                <img loading="lazy" src="{{ image }}" width="100%" height="100%" alt="{{ image:alt }}">
                            </picture>
                        </div>
                    {{ endif }}
                    {{ if subtitle }}
                        <p class="subtitle {{ page_colour ?= page_colour|slugify }} ">
                            {{ subtitle }}
                        </p>
                    {{ endif }}
                    {{ if content }}
                        <div class="content {{ colour ? colour|slugify : '' }}">
                            {{ content }}
                        </div>
                    {{ endif }}
                </div>
            {{ /items }}
        </div>
    </div>
</section>
