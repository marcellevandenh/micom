<section class="services-grid {{ if apply_page_colour}} apply-page-colour  {{page_colour|slugify }} {{ endif}}">
    <div class="wrapper {{ if apply_page_colour}} apply-page-colour {{page_colour|slugify }}  {{ endif}}">
        <div class="content">
            {{ if subtitle }}
                <p class="subtitle">
                    {{ subtitle }}
                </p>
            {{ endif }}
            {{ content ? content : '' }}
        </div>
        <div class="items ">
            {{ items }} 
                <div class="item ">
                    {{ if icon & !apply_page_colour}}
                        <div class="icon {{ colour ? colour|slugify : '' }}">
                            <picture>
                                <source media="(min-width: 1200px)" srcset="{{ glide:icon width='150' }}" type="image/webp">
                                <source media="(max-width: 1199px)" srcset="{{ glide:icon width='150' }}" type="image/webp">
                                <img class="plaster" loading="lazy" src="{{ icon }}" width="100%" height="100%" alt="{{ icon:alt }}">
                            </picture>
                        </div>
                    {{ endif }}
                    {{ if icon & apply_page_colour}}
               
                        <div class="icon {{ colour ? colour|slugify : '' }}">
                            {{ svg src="{{ icon }}" class="icon-svg" }}
                        </div>
                      
                    {{ endif}}

                    {{ if content }}
                        <div class="content {{ colour ? colour|slugify : '' }}">
                            {{ content }}
                        </div>
                    {{ endif }}
                </div>
            {{ /items }}
        </div>
    </div>
</section>
