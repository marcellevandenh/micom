<section class="call-to-action">
    <div class="wrapper ">
        <div class="content {{ !image ? 'no-image' : '' }} {{ if apply_page_colour }} apply-page-colour {{page_colour|slugify }}  {{ endif}}">
            {{ content ? content : '' }} 
            {{ partial:buttons }}   

        </div>

        {{ if image }}
            <div class="image">
                <picture>
                    <source media="(min-width: 1200px)" srcset="{{ glide:image width='500' }}" type="image/webp">
                    <source media="(max-width: 1199px)" srcset="{{ glide:image width='500' }}" type="image/webp">
                    <img loading="lazy" src="{{ image }}" width="100%" height="100%" alt="{{ image:alt }}">
                </picture>
            </div>
        {{ endif }}
    </div>
</section>
